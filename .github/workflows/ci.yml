name: TaskAnalyzer CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pytest:
    name: Python 3.11 - pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute test harness
        run: python -m pytest tests/test_harness.py -v
  docker:
    name: Docker - isolated test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t taskanalyzer:test .
      - name: Run tests inside container
        run: docker run --rm taskanalyzer:test
      - name: Validate Docker Compose orchestration
        run: docker compose run --build --rm tests
